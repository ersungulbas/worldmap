<!--HEAD-->
<style>
/* Layout: one full-bleed map; floating controls in the four corners, nothing else on screen. */
:root{
  --ocean:#e9f0f6;
  --land:#ffffff;
  --border:#c3ceda;
  --sel:#7fb2ee;
  --sel-border:#4f8fd8;
  --sel-label:#0f3463;
  --label:#5d6b7c;
  --ink:#16212e;
  --muted:#6a7787;
  --chrome:rgba(255,255,255,.88);
  --chrome-line:rgba(22,33,46,.10);
  --accent:#2f7ee0;
  --flash:#ff9f43;
  --danger:#e0484f;
  --friend:#f6b26b;
  --friend-border:#d98a3a;
  --both:#a594f5;
  --both-border:#6f5fd6;
  --shadow:0 6px 24px rgba(20,40,70,.12),0 1px 3px rgba(20,40,70,.08);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --friend:#b9773a;--friend-border:#f0a85e;--both:#7b68e0;--both-border:#b4a8ff;
  --ocean:#0c141e;--land:#1b2633;--border:#33445a;--sel:#3f7fd0;--sel-border:#7fb2ee;--sel-label:#eaf3ff;
  --label:#8796a8;--ink:#eef3f8;--muted:#9aa8b8;--chrome:rgba(22,32,44,.86);--chrome-line:rgba(255,255,255,.10);
  --accent:#6aa8f2;--flash:#ffb36b;--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --friend:#b9773a;--friend-border:#f0a85e;--both:#7b68e0;--both-border:#b4a8ff;
  --ocean:#0c141e;--land:#1b2633;--border:#33445a;--sel:#3f7fd0;--sel-border:#7fb2ee;--sel-label:#eaf3ff;
  --label:#8796a8;--ink:#eef3f8;--muted:#9aa8b8;--chrome:rgba(22,32,44,.86);--chrome-line:rgba(255,255,255,.10);
  --accent:#6aa8f2;--flash:#ffb36b;--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}
[hidden]{display:none!important}
#cmp,#iab,#linkout{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ocean);color:var(--ink);font-family:var(--f-body);overflow-x:hidden;overflow-y:auto;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
/* site only: the map fills the first screen and the intro text sits below it */
body:has(#intro){margin:0}
body:has(#intro) #app{position:relative;inset:auto;height:100vh;height:100svh}
#intro{max-width:760px;margin:0 auto;padding:40px 20px calc(48px + env(safe-area-inset-bottom,0px));font-size:16.5px;line-height:1.65;-webkit-user-select:text;user-select:text}
#intro h2{font:800 clamp(24px,4.4vw,32px)/1.2 var(--f-display);margin:36px 0 12px;letter-spacing:-.01em}
#intro h2:first-child{margin-top:0}
#intro ul{padding-left:20px}
#intro li{margin:6px 0}
#intro a{color:var(--accent);font-weight:700}
#intro details{border-top:1px solid var(--chrome-line);padding:10px 0}
#intro summary{font-weight:700;cursor:pointer}
#intro details p{margin:8px 0 0}
#intro .more{color:var(--muted);font-size:14px;border-top:1px solid var(--chrome-line);margin-top:36px;padding-top:16px}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.c{fill:var(--land);stroke:var(--border);stroke-width:.7;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .25s ease}
.c.on{fill:var(--sel);stroke:var(--sel-border)}
.dz{fill:var(--land);fill-opacity:.55;stroke:var(--border);stroke-width:.7;stroke-dasharray:3 2;vector-effect:non-scaling-stroke;pointer-events:none}
.c.fr{fill:var(--friend);stroke:var(--friend-border)}
.c.on.fr{fill:var(--both);stroke:var(--both-border)}
.c.flash{stroke:var(--flash);stroke-width:2.5;animation:flash 1.1s ease-in-out 3}
@keyframes flash{50%{stroke-width:5;stroke-opacity:.35}}
.lb{fill:var(--label);font-family:var(--f-body);font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none;letter-spacing:.01em}
.lb.on{fill:var(--sel-label);font-weight:700}
.lb.hl{fill:var(--ink);font-weight:700}

/* chrome */
.chip{background:var(--chrome);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
  border:1px solid var(--chrome-line);box-shadow:var(--shadow);border-radius:14px}
#search{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:min(300px,calc(100vw - 24px));z-index:5}
#search .box{display:flex;align-items:center;gap:8px;padding:0 12px;height:46px}
#search svg{flex:none;color:var(--muted)}
#q{flex:1;min-width:0;border:0;background:transparent;outline:none;font:600 16px var(--f-body);color:var(--ink)}
#q::placeholder{color:var(--muted);font-weight:500}
#res{margin-top:6px;padding:6px;list-style:none;max-height:min(340px,50vh);overflow:auto}
#res li{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:15px}
#res li small{color:var(--muted);font-weight:500}
#res li[aria-selected="true"],#res li:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
#res li .dot{width:10px;height:10px;border-radius:50%;background:var(--sel);align-self:center;flex:none}
#zoom{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;display:flex;flex-direction:column;overflow:hidden;z-index:4}
#zoom button{width:44px;height:44px;border:0;background:transparent;color:var(--ink);font:600 22px/1 var(--f-body);cursor:pointer}
#zoom button+button{border-top:1px solid var(--chrome-line)}
#brand{position:absolute;left:14px;bottom:calc(14px + var(--legal-h,env(safe-area-inset-bottom,0px)));font:800 18px var(--f-display);letter-spacing:-.01em;color:var(--ink);z-index:3;pointer-events:none;text-shadow:0 0 6px var(--ocean),0 0 2px var(--ocean)}
#brand span{color:var(--accent)}
#dock{position:absolute;right:12px;bottom:calc(12px + var(--legal-h,env(safe-area-inset-bottom,0px)));display:flex;align-items:stretch;gap:8px;z-index:4}
#count{padding:6px 14px 6px 14px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;min-width:72px}
#count b{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:-.02em}
#count small{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
#save{border:0;border-radius:14px;padding:0 20px;background:var(--accent);color:#fff;font:700 16px var(--f-body);cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
#save:active,#clear:active{transform:scale(.97)}
#clear{align-self:center;height:46px;min-width:46px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);cursor:pointer;font:700 14px var(--f-body);transition:background .2s,color .2s}
#clear .t{display:none;white-space:nowrap}
#clear.arm{background:var(--danger);color:#fff;border-color:transparent}
#clear.arm .t{display:inline}
#clear:disabled{opacity:.45;cursor:default}
button:focus-visible,#q:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--legal-h,env(safe-area-inset-bottom,0px)));padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;z-index:3;transition:opacity .4s}
#hint.gone{opacity:0;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(86px + var(--legal-h,env(safe-area-inset-bottom,0px)));transform:translate(-50%,8px);padding:9px 14px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#ring{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;pointer-events:none;z-index:6;opacity:0}
#ring circle{fill:none;stroke:var(--flash);stroke-width:4;stroke-linecap:round;stroke-dasharray:176;stroke-dashoffset:176;transform:rotate(-90deg);transform-origin:center}
#ring.go{opacity:1}
#ring.go circle{transition:stroke-dashoffset .5s linear;stroke-dashoffset:0}

/* save preview */
#sheet{position:fixed;inset:0;z-index:10;background:color-mix(in srgb,var(--ocean) 70%,#000 30%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#shotbox{flex:1 1 auto;min-height:0;width:100%;display:grid;place-items:center;container-type:size}
#sheet img{max-width:100%;max-height:100%;max-width:100cqw;max-height:100cqh;transition:opacity .2s;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#sheet .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#sheet .row button,#sheet .row a{border:0;border-radius:12px;padding:12px 22px;font:700 16px var(--f-body);cursor:pointer;text-decoration:none}
#dl,#share{background:var(--accent);color:#fff}
#link{background:var(--chrome);color:var(--ink)}
#linkout{width:min(520px,100%);border:1px solid var(--chrome-line);border-radius:10px;padding:10px 12px;font:600 14px var(--f-body);background:var(--chrome);color:var(--ink);-webkit-user-select:text;user-select:text}
.seg{display:flex;padding:4px;gap:4px;border-radius:12px}
.seg button{border:0;background:transparent;color:var(--ink);font:700 14px var(--f-body);padding:8px 14px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
#cmp{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(380px,calc(100vw - 24px));padding:10px 12px 10px 14px;z-index:5;display:flex;flex-direction:column;gap:6px}
#cmp .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
#cmp .top b{font:800 16px var(--f-display)}
#cmpX{border:0;background:transparent;color:var(--muted);font:600 24px/1 var(--f-body);width:32px;height:32px;cursor:pointer;border-radius:8px}
#cmp .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--muted)}
#cmp .lg span{display:flex;align-items:center;gap:6px}
#cmp .lg em{font-style:normal}
#cmp .lg b{color:var(--ink);font-variant-numeric:tabular-nums}
#cmp i{width:12px;height:12px;border-radius:4px;display:inline-block}
#cmp i.f{background:var(--friend)} #cmp i.y{background:var(--sel)} #cmp i.b{background:var(--both)}
#cmp small{font-size:12px;color:var(--muted);font-weight:500}
#iab{position:absolute;top:calc(68px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(380px,calc(100vw - 24px));padding:10px 8px 10px 14px;z-index:5;display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:600;line-height:1.4}
#iab span{flex:1;min-width:0}
#iabX{flex:none;border:0;background:transparent;color:var(--muted);font:600 22px/1 var(--f-body);width:30px;height:30px;cursor:pointer;border-radius:8px}
#cmp .tip{display:flex;align-items:center;justify-content:space-between;gap:10px}
#cmpMine{flex:none;border:0;border-radius:9px;background:var(--accent);color:#fff;font:700 13px var(--f-body);padding:7px 11px;cursor:pointer}
#close{background:var(--chrome);color:var(--ink)}
#sheet p{margin:0;color:#fff;font-size:13px;font-weight:600;opacity:.85;text-align:center;max-width:520px}
#loading{position:absolute;inset:0;display:grid;place-items:center;font:700 18px var(--f-display);color:var(--muted)}
/* bottom strip: short disclaimer + legal links */
#legal{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:6px 14px calc(6px + env(safe-area-inset-bottom,0px));font-size:11.5px;line-height:1.55;font-weight:500;color:var(--muted);text-align:center;
  background:color-mix(in srgb,var(--ocean) 84%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--chrome-line)}
#legal a,#legal button{color:inherit;font:inherit;font-weight:700;text-decoration:none;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
#legal a:hover,#legal button:hover{color:var(--ink);text-decoration:underline}
#legal i{font-style:normal;opacity:.45;margin:0 6px;display:inline-block}
a:focus-visible,#legal button:focus-visible,#res .tg:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* consent banner: Accept and Reject look the same on purpose */
#consent{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--legal-h,0px));width:min(520px,calc(100vw - 24px));box-sizing:border-box;padding:14px 16px;z-index:8;font-size:13.5px;line-height:1.45;font-weight:500}
#consent p{margin:0 0 10px}
#consent a{color:var(--accent);font-weight:700}
.btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btns button{flex:1 1 0;min-width:110px;border:1px solid var(--chrome-line);border-radius:10px;padding:10px 14px;font:700 15px var(--f-body);cursor:pointer;background:var(--land);color:var(--ink)}
/* restore code dialog */
#dlg{position:fixed;inset:0;z-index:12;display:grid;place-items:center;padding:16px;background:rgba(10,20,30,.45)}
#dlgF{width:min(380px,100%);box-sizing:border-box;padding:18px;display:flex;flex-direction:column;gap:10px}
#dlgF b{font:800 19px var(--f-display)}
#dlgF p{margin:0;font-size:14px;line-height:1.45;color:var(--muted);font-weight:500}
#codeIn{font:800 24px/1 var(--f-display);letter-spacing:.12em;text-align:center;text-transform:uppercase;padding:12px;border-radius:10px;border:1px solid var(--chrome-line);background:var(--land);color:var(--ink);-webkit-user-select:text;user-select:text;min-width:0}
#dlgF #dlgErr{color:var(--danger);min-height:1.2em;font-weight:600}
#dlgGo{background:var(--accent)!important;color:#fff!important;border-color:transparent!important}
#hint button{display:block;margin:6px auto 0;border:0;background:none;color:var(--accent);font:700 13px var(--f-body);cursor:pointer;padding:2px 4px}
/* save sheet extras */
.fmtrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
#qrT{border:1px solid var(--chrome-line);border-radius:12px;height:44px;padding:0 14px;font:700 14px var(--f-body);cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:7px}
#qrT[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}
#codebox{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;color:#fff;font-size:13px;font-weight:600}
#codebox b{font:800 17px var(--f-display);letter-spacing:.08em}
#codebox button{border:0;border-radius:9px;padding:7px 11px;font:700 13px var(--f-body);cursor:pointer;background:var(--chrome);color:var(--ink)}
#codebox button.arm{background:var(--danger);color:#fff}
#adbox{width:min(728px,100%);min-height:50px;text-align:center}
#adbox small{display:block;color:#fff;opacity:.6;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
#res li .tg{flex:none;width:30px;height:30px;margin:-5px -6px -5px 0;border-radius:8px;border:1px solid var(--chrome-line);background:var(--land);color:var(--accent);font:800 17px/1 var(--f-body);cursor:pointer;display:grid;place-items:center;padding:0}
#res li .tg.on{background:var(--sel);color:#fff;border-color:transparent}
@media (max-width:480px){
  #search{width:calc(100vw - 80px)}
  #sheet .row button{padding:11px 16px;font-size:15px}
  #save{padding:0 16px}
  #save .t{display:none}
  #clear.arm .t{display:none}
  #brand{font-size:16px;bottom:calc(18px + var(--legal-h,env(safe-area-inset-bottom,0px)))}
}
@media (max-width:1010px){ #cmp{top:calc(68px + env(safe-area-inset-top,0px))} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <h1 class="sr" id="h1">worldmap.tech</h1>
  <div id="loading">worldmap.tech</div>
  <svg id="map" role="img" aria-label="World map"></svg>

<script>
const boot = async function(){
const CFG = JSON.parse(document.getElementById("cfg").textContent);
// "site" = the real worldmap.tech build (own server, restore codes, ads); otherwise the self-contained preview
const SITE = CFG.env === "site" && /^https?:$/.test(location.protocol);
const TR = CFG.lang ? CFG.lang === "tr" : /^tr\b/i.test(navigator.language || "");
// ?dumplabels: lay labels out from scratch and expose them (build step that precomputes NM.L / NM.B)
const DUMP = /[?&]dumplabels\b/.test(location.search);

function polylabel(rings, precision){
  // pole of inaccessibility (Mapbox algorithm, compact)
  const outer = rings[0]; let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for (const [x,y] of outer){ if(x<minX)minX=x; if(y<minY)minY=y; if(x>maxX)maxX=x; if(y>maxY)maxY=y; }
  const w=maxX-minX, h=maxY-minY, cs=Math.min(w,h); if(cs===0) return [minX,minY,0];
  const dist=(x,y)=>{ let inside=false, md=Infinity;
    for (const r of rings){ for(let i=0,n=r.length,j=n-1;i<n;j=i++){ const a=r[i], b=r[j];
      if((a[1]>y)!==(b[1]>y) && x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]) inside=!inside;
      let px=a[0],py=a[1],dx=b[0]-px,dy=b[1]-py; if(dx||dy){ const t=((x-px)*dx+(y-py)*dy)/(dx*dx+dy*dy); if(t>1){px=b[0];py=b[1];} else if(t>0){px+=dx*t;py+=dy*t;} }
      dx=x-px; dy=y-py; const d=dx*dx+dy*dy; if(d<md) md=d; } }
    return (inside?1:-1)*Math.sqrt(md); };
  const cell=(x,y,hh)=>{ const d=dist(x,y); return {x,y,h:hh,d,max:d+hh*Math.SQRT2}; };
  const q=[]; const push=c=>{ q.push(c); }; const pop=()=>{ let bi=0; for(let i=1;i<q.length;i++) if(q[i].max>q[bi].max) bi=i; return q.splice(bi,1)[0]; };
  let hh=cs/2; for(let x=minX;x<maxX;x+=cs) for(let y=minY;y<maxY;y+=cs) push(cell(x+hh,y+hh,hh));
  // centroid seed
  let best=cell(minX+w/2,minY+h/2,0);
  let a=0,cx=0,cy=0; for(let i=0,n=outer.length,j=n-1;i<n;j=i++){ const p=outer[i],q2=outer[j],f=p[0]*q2[1]-q2[0]*p[1]; cx+=(p[0]+q2[0])*f; cy+=(p[1]+q2[1])*f; a+=f*3; }

  while(q.length && it++<4000){ const c=pop(); if(c.d>best.d) best=c; if(c.max-best.d<=precision) continue;
    const h2=c.h/2; push(cell(c.x-h2,c.y-h2,h2)); push(cell(c.x+h2,c.y-h2,h2)); push(cell(c.x-h2,c.y+h2,h2)); push(cell(c.x+h2,c.y+h2,h2)); }

}

function layoutLabel(k){
  // precomputed at build time (lon/lat of the label, font size relative to the projection scale, line breaks)
  const pre = !DUMP && NM.L && NM.L[TR ? "tr" : "en"] && NM.L[TR ? "tr" : "en"][k];
  if (pre){ const pt = proj([pre[0], pre[1]]); return pt && {k, x:pt[0], y:pt[1], fs:pre[2]*proj.scale(), lines:pre[3]}; }
  // largest projected polygon of the country
  let best=null, bestA=0;
  for (const f of groups.get(k)){
    const g=f.geometry; const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
    for (const poly of polys){
      const rings = poly.map(r => r.map(p => proj(p)).filter(Boolean));
      if (!rings[0] || rings[0].length<4) continue;
      const a=Math.abs(d3.polygonArea(rings[0])); if(a>bestA){bestA=a;best=rings;}
    }
  }
  if(!best) return null;
  const [x0,y0] = d3.extent(best[0],p=>p[0]), ys=d3.extent(best[0],p=>p[1]);
  const span=Math.max(x0===undefined?0:y0-x0, ys[1]-ys[0]);
  const [px,py,r] = polylabel(best, Math.max(span/120, .05));
  const text = labelOf(k);
  const words = text.split(" ");
  // candidate line breaks: 1 line, 2 lines, 3 lines
  const cands = [[text]];
  if (words.length>=2){ let bestSplit=null,bw=Infinity; for(let i=1;i<words.length;i++){ const a=words.slice(0,i).join(" "), b=words.slice(i).join(" "); const m=Math.max(measure(a),measure(b)); if(m<bw){bw=m;bestSplit=[a,b];} } cands.push(bestSplit); }
  if (words.length>=3){ cands.push(threeLines(words)); }
  let top=null;
  for (const lines of cands){
    const tw = Math.max(...lines.map(measure)), th = lines.length*1.05;
    // start with the inscribed circle, then shrink until the text box sits inside the shape
    let fs = (2*r*0.92)/Math.hypot(tw, th);
    fs *= 1.25; // circle is conservative; let the box test decide
    for (let i=0;i<14;i++){
      const hw=tw*fs/2, hh=th*fs/2*0.86;
      const pts=[[px-hw,py-hh],[px+hw,py-hh],[px-hw,py+hh],[px+hw,py+hh],[px,py-hh],[px,py+hh],[px-hw,py],[px+hw,py],[px-hw/2,py-hh],[px+hw/2,py+hh],[px+hw/2,py-hh],[px-hw/2,py+hh]];
      if (pts.every(p=>inside(best,p[0],p[1]))) break;
      fs*=0.88;
    }
    if(!top || fs>top.fs*1.08) top={lines,fs};
  }
  return {k, x:px, y:py, fs:top.fs, lines:top.lines};
}
function threeLines(words){
  let best=null,bw=Infinity;
  for(let i=1;i<words.length-1;i++) for(let j=i+1;j<words.length;j++){
    const ls=[words.slice(0,i).join(" "),words.slice(i,j).join(" "),words.slice(j).join(" ")]; const m=Math.max(...ls.map(measure)); if(m<bw){bw=m;best=ls;} }
  return best;
}

function build(){

  proj = d3.geoNaturalEarth1();
  if (NM.B && !DUMP){
    // same as fitExtent, from the world's bounds at scale 150 (precomputed): saves a pass over every coordinate
    const b = NM.B, w = ext[1][0]-ext[0][0], h = ext[1][1]-ext[0][1], k = Math.min(w/(b[1][0]-b[0][0]), h/(b[1][1]-b[0][1]));
    proj.scale(150*k).translate([ext[0][0] + (w - k*(b[1][0]+b[0][0]))/2, ext[0][1] + (h - k*(b[1][1]+b[0][1]))/2]);
  } else proj.fitExtent(ext, {type:"FeatureCollection",features:feats});
  path = d3.geoPath(proj);
  gC.selectAll("path").data(KEYS, d=>d).join("path")
    .attr("class", k => "c"+(sel.has(k)?" on":"")+(friend && friend.has(k)?" fr":""))
    .attr("data-k", k=>k)
    .attr("d", k => path(geoByKey.get(k)));

  labels = KEYS.map(layoutLabel).filter(Boolean);

    B: d3.geoPath(d3.geoNaturalEarth1().scale(150).translate([0,0])).bounds({type:"FeatureCollection",features:feats}),
    L: Object.fromEntries(labels.map(l => { const ll = proj.invert([l.x, l.y]); return [l.k, [+ll[0].toFixed(4), +ll[1].toFixed(4), +(l.fs/proj.scale()).toPrecision(5), l.lines]]; })) };
  const t = gL.selectAll("text").data(labels, d=>d.k).join("text")
    .attr("class", d => "lb"+(sel.has(d.k)?" on":""))
    .attr("x", d=>d.x).attr("y", d=>d.y);
  t.selectAll("tspan").data(d => d.lines.map((s,i)=>({s,i,n:d.lines.length,x:d.x}))).join("tspan")
    .attr("x", d=>d.x).text(d=>d.s);

  }
  svg.call(zoom.transform, tf);
  applyZoom();
}

const MINPX = 7.5, MAXPX = 24;
function applyZoom(){
  root.attr("transform", tf);
  const k = tf.k;
  gL.selectAll("text").each(function(d){
    const screen = d.fs*k;
    const show = screen >= MINPX || d.k===hlKey;
    const px = Math.min(Math.max(screen, d.k===hlKey?13:0), MAXPX + Math.log2(k)*2);
    this.style.display = show ? "" : "none";
    if (!show) return;
    const fs = px/k;
    this.setAttribute("font-size", fs);
    const n=d.lines.length, lh=fs*1.05;
    const ts=this.childNodes;
    for (let i=0;i<ts.length;i++) ts[i].setAttribute("y", d.y + (i-(n-1)/2)*lh);
    this.style.opacity = d.k===hlKey ? 1 : Math.min(1,(screen-MINPX)/3+0.35);
  });
}

function mainBounds(k){

const FORMATS = {story:[1080,1920], square:[1080,1080], wide:[1920,1080]};
async function renderImage(fmt){

    headBottom = pad + capS + titleS*1.3;
  }

  const brandW = ctx.measureText("worldmap.tech").width;
  const room = cw - pad*2 - brandW - u*4;
  const lines = [T.visited, pctLine(n)];
  let sub = Math.max(big*0.13, u*2.4);

  }

    const b = d3.geoPath(p2).bounds(FC);
    const mh = b[1][1]-b[0][1], availTop = headBottom + u*3, availBot = numTop - u*3;
    let blockH = mh;
    if (ks.length && flagsOK()){
      const gap = u*6, avail = cw - pad*2, maxH = (availBot - availTop) - mh - gap;

    ctx.textAlign="center"; ctx.textBaseline="middle";

  ctx.fillStyle = v("--ink"); ctx.fillText(lines[0], cw-pad, ch-pad-lineGap);
  ctx.fillStyle = v("--muted"); ctx.fillText(lines[1], cw-pad, ch-pad);

  ctx.textAlign="left";

}
// QR for the share link. On the real site the scheme+host and the country list go in
// alphanumeric mode (upper case), which keeps the code small enough to scan off a screen.
function qrMatrix(url){
  if (typeof qrcode !== "function") return null;
  try {
    const q = qrcode(0, "L");
    const m = SITE && url.match(/^(https?:\/\/[a-z0-9.:-]+)(\/[^#]*)(#w(?:[A-Z]{2})+)?$/i);
    if (m){
      q.addData(m[1].toUpperCase(), "Alphanumeric");
      q.addData(m[2] + (m[3] ? "#" : ""), "Byte");
      if (m[3]) q.addData(m[3].slice(1).toUpperCase(), "Alphanumeric");
    } else q.addData(url, "Byte");
    q.make(); return q;
  } catch(e){ return null; }
}
const flag = k => String.fromCodePoint(...[...k].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
// Emoji sets have no flag for Northern Cyprus, so it is painted by hand.
function drawFlag(ctx, k, x, y, s){
  if (k !== "XC"){ ctx.fillText(flag(k), x, y); return; }
  const w = s*1.12, h = s*0.76, x0 = x - w/2, y0 = y - h/2, red = "#e30a17";   // sized like the emoji flags beside it
  ctx.save();
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x0, y0, w, h, s*0.06) : ctx.rect(x0, y0, w, h); ctx.clip();
  ctx.fillStyle = "#fff"; ctx.fillRect(x0, y0, w, h);
  ctx.fillStyle = red; ctx.fillRect(x0, y0 + h*0.1, w, h*0.06); ctx.fillRect(x0, y0 + h*0.84, w, h*0.06);
  // crescent and star, as on the flag of Türkiye but smaller and red on white
  const cx = x - w*0.06, r1 = h*0.21, r2 = r1*0.8;
  ctx.beginPath(); ctx.arc(cx, y, r1, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(cx + r1*0.25, y, r2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = red; ctx.beginPath();
  const sx = cx + r1*0.95, sr = r1*0.42;
  for (let i=0;i<10;i++){ const a = Math.PI*(i+1)/5, rr = i%2 ? sr*0.4 : sr; ctx.lineTo(sx + rr*Math.cos(a), y + rr*Math.sin(a)); }
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.lineWidth = Math.max(1, s*0.02);
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x0, y0, w, h, s*0.06) : ctx.rect(x0, y0, w, h); ctx.stroke();
}

    if (navigator.canShare(data)) await navigator.share(data);
    else await navigator.share({text: shareText(), url: shareURL()});
  } catch(e){ if (e && e.name !== "AbortError") toast(T.shareFail); }
};

// ---------- restore code: server copy of the map, kept in step with every change ----------
async function api(method, id, s){
  const r = await fetch("/api/code" + (id ? "/" + id : ""), {method, cache:"no-store",
    headers: s !== undefined ? {"content-type":"application/json"} : undefined, body: s !== undefined ? JSON.stringify({s}) : undefined});
  if (r.status === 404){ const e = new Error("not found"); e.notFound = true; throw e; }
  if (!r.ok) throw new Error("http " + r.status);
  return r.status === 204 ? null : r.json();
}
const prettyCode = c => c.slice(0,4) + "-" + c.slice(4);
const cleanCode = s => s.toUpperCase().replace(/[IL]/g,"1").replace(/O/g,"0").replace(/[^0-9A-Z]/g,"");
const selStr = () => [...sel].sort().join("");
const setOf = s => new Set((s.match(/../g) || []).filter(k => groups.has(k)));
function saveCodeState(){
  try {
    if (code){ localStorage.setItem("wmn.code", code); localStorage.setItem("wmn.codeAt", String(codeAt)); localStorage.setItem("wmn.codeDirty", codeDirty ? "1" : "0"); }
    else ["wmn.code","wmn.codeAt","wmn.codeDirty"].forEach(k => localStorage.removeItem(k));
  } catch(e){}
}
let pushT = 0;
function codeChanged(){ if (!code) return; codeDirty = true; saveCodeState(); clearTimeout(pushT); pushT = setTimeout(pushCode, 1200); }
async function pushCode(){
  if (!code) return;
  try { const r = await api("PUT", code, selStr()); codeAt = r.u; codeDirty = false; saveCodeState(); }
  catch(e){ if (e.notFound){ code = null; saveCodeState(); } }
}
// on load: take the server copy if another device changed it (keeping unsynced local marks)
async function pullCode(){
  if (!code) return;
  try {
    const r = await api("GET", code);
    if (r.u > codeAt){ const next = setOf(r.s); if (codeDirty) sel.forEach(k => next.add(k)); codeAt = r.u; replaceSel(next, codeDirty); }
    else if (codeDirty) pushCode();
  } catch(e){ if (e.notFound){ code = null; saveCodeState(); } }
}
function replaceSel(next, push){
  sel = next;
  gC.selectAll("path").classed("on", k => sel.has(k));
  gL.selectAll("text").classed("on", d => sel.has(d.k));
  try { localStorage.setItem("wmn.sel", JSON.stringify([...sel])); } catch(e){}
  syncHash(); updCount(); updCompare(); if (sel.size) dismissHint();
  if (push) codeChanged(); else saveCodeState();
}
let delArm = 0;
function renderCode(){
  const box = $("codebox");
  if (!SITE){ box.hidden = true; return; }
  box.hidden = false; box.innerHTML = "";
  const btn = txt => { const b = document.createElement("button"); b.type = "button"; b.textContent = txt; box.appendChild(b); return b; };
  if (code){
    const l = document.createElement("span"); l.textContent = T.codeL; box.appendChild(l);
    const v = document.createElement("b"); v.textContent = prettyCode(code); box.appendChild(v);
    btn(T.codeCopy).onclick = () => copyText(prettyCode(code), T.codeCopied);
    const d = btn(T.codeDel);
    d.onclick = async () => {
      if (!d.classList.contains("arm")){ d.classList.add("arm"); d.textContent = T.codeDelSure; clearTimeout(delArm); delArm = setTimeout(renderCode, 3000); return; }
      clearTimeout(delArm);
      try { await api("DELETE", code); } catch(e){ if (!e.notFound){ toast(T.codeNet, 2400); return; } }
      code = null; codeAt = 0; codeDirty = false; saveCodeState(); renderCode(); toast(T.codeGone, 2400);
    };
  } else {
    const g = btn(T.codeGet);
    g.onclick = async () => {
      g.disabled = true;
      try { const r = await api("POST", null, selStr()); code = r.code; codeAt = r.u; codeDirty = false; saveCodeState(); renderCode(); toast(T.codeReady, 2600); }
      catch(e){ g.disabled = false; toast(T.codeNet, 2400); }
    };
    btn(T.codeHave).onclick = openDlg;
  }
}
function openDlg(){ $("dlg").hidden = false; $("codeIn").value = ""; $("dlgErr").textContent = ""; setTimeout(() => $("codeIn").focus(), 30); }
function closeDlg(){ $("dlg").hidden = true; }
$("dlgX").onclick = closeDlg;
$("dlg").addEventListener("pointerdown", e => { if (e.target === $("dlg")) closeDlg(); });
$("codeIn").addEventListener("input", e => { const c = cleanCode(e.target.value).slice(0,8); e.target.value = c.length > 4 ? c.slice(0,4) + "-" + c.slice(4) : c; });
$("dlgF").addEventListener("submit", async e => {
  e.preventDefault();
  const c = cleanCode($("codeIn").value);
  if (!CODE_OK.test(c)){ $("dlgErr").textContent = T.codeBad; return; }
  $("dlgGo").disabled = true; $("dlgErr").textContent = "";
  try {
    const r = await api("GET", c), next = setOf(r.s);
    const extra = [...sel].some(k => !next.has(k));          // marks only this device has: keep them and send them up
    sel.forEach(k => next.add(k));
    code = c; codeAt = r.u; codeDirty = false;
    replaceSel(next, extra);
    closeDlg(); $("sheet").hidden = true; toast(T.restored, 2200);
  } catch(err){ $("dlgErr").textContent = err.notFound ? T.codeNotFound : T.codeNet; }
  finally { $("dlgGo").disabled = false; }
});

// ---------- consent + ads: only on the real site, and only once an AdSense id is configured ----------
// EEA/UK/CH and US visitors get Google's own consent message (certified CMP, set up in AdSense);
// everyone else gets this banner, and ads load only after "Accept".
function loadAds(){
  if (adsLoaded || !ADS) return; adsLoaded = true;
  // EEA, UK and Switzerland: non-personalised ads only (no ad profiling of visitors there)
  if (region && GOOGLE_CMP.has(region) && region !== "US") (window.adsbygoogle = window.adsbygoogle || []).requestNonPersonalizedAds = 1;
  const sc = document.createElement("script"); sc.async = true; sc.crossOrigin = "anonymous";
  sc.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + encodeURIComponent(ADS.client);
  document.head.appendChild(sc);
}
function showAd(){
  if (!adsLoaded || adShown || !ADS.slot) return; adShown = true;
  const ins = $("adbox").querySelector("ins");
  ins.setAttribute("data-ad-client", ADS.client); ins.setAttribute("data-ad-slot", ADS.slot);
  $("adbox").hidden = false;
  try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch(e){}
}
function setConsent(v){
  consent = v; try { localStorage.setItem("wmn.consent", v); } catch(e){}
  $("consent").hidden = true;
  if (v === "y") loadAds(); else if (adsLoaded) location.reload();
}
$("cYes").onclick = () => setConsent("y");
$("cNo").onclick = () => setConsent("n");
function openPrefs(){
  if (region && GOOGLE_CMP.has(region)){
    window.googlefc = window.googlefc || {}; googlefc.callbackQueue = googlefc.callbackQueue || [];
    googlefc.callbackQueue.push(() => googlefc.showRevocationMessage && googlefc.showRevocationMessage());
    return;
  }
  $("consent").hidden = false; $("cYes").focus();
}
async function initConsent(){
  if (!ADS) return;
  try { const t = await (await fetch("/cdn-cgi/trace", {cache:"no-store"})).text(); const m = t.match(/^loc=([A-Z]{2})$/m); region = m ? m[1] : null; } catch(e){}
  if (region && GOOGLE_CMP.has(region)) loadAds();
  else if (consent === "y") loadAds();
  else if (consent !== "n") $("consent").hidden = false;
}

// ---------- bottom strip: disclaimer + legal links (+ language switch on the site) ----------
function renderLegal(){
  const f = $("legal"), BASE = SITE ? "" : "https://worldmap.tech";
  const L = TR ? {guides:"/rehber/", terms:"/kosullar/", privacy:"/gizlilik/", faq:"/sss/", contact:"/iletisim/", other:"/", lang:"en"} : {guides:"/guides/", terms:"/terms/", privacy:"/privacy/", faq:"/faq/", contact:"/contact/", other:"/tr/", lang:"tr"};
  const sep = () => { const i = document.createElement("i"); i.textContent = "·"; i.setAttribute("aria-hidden","true"); f.appendChild(i); };
  const link = (href, text) => { sep(); const a = document.createElement("a"); a.href = BASE + href; a.textContent = text; if (!SITE){ a.target = "_blank"; a.rel = "noopener"; } f.appendChild(a); return a; };
  f.innerHTML = ""; const d = document.createElement("span"); d.textContent = T.footer; f.appendChild(d);
  if (SITE && $("intro")) link("#intro", T.how);
  link(L.guides, T.guides); link(L.terms, T.terms); link(L.privacy, T.privacy); link(L.faq, T.faq); link(L.contact, T.contact);
  if (ADS){ sep(); const b = document.createElement("button"); b.type = "button"; b.textContent = T.prefs; b.onclick = openPrefs; f.appendChild(b); }
  if (SITE){
    const a = link(L.other, T.langName); a.hreflang = a.lang = L.lang;
    a.onclick = () => { try { localStorage.setItem("wmn.lang", L.lang); } catch(e){} a.href = L.other + location.hash; };
  }
  const setH = () => document.documentElement.style.setProperty("--legal-h", f.offsetHeight + "px");
  setH(); if (window.ResizeObserver) new ResizeObserver(setH).observe(f);
}

// ---------- boot ----------
updCount();
let rz=0; window.addEventListener("resize", () => { clearTimeout(rz); rz=setTimeout(()=>{
  // only a width change (rotation, window resize) re-lays the map; a keyboard opening changes height only
  const r=$("app").getBoundingClientRect(); if (Math.abs(r.width-W) > 2 || Math.abs(r.height-H) > H*0.45) build(); }, 150); });
const start = () => { $("loading").remove(); build(); updCompare(); syncHash(); if (sel.size || friend) dismissHint(); pullCode(); initConsent(); };
// label widths are measured with Figtree, so wait for it (briefly)
(document.fonts ? Promise.race([Promise.all([document.fonts.ready, document.fonts.load("600 16px Figtree"), document.fonts.load("700 16px Figtree")]), new Promise(r=>setTimeout(r,1500))]) : Promise.resolve()).then(start);
};
// libraries load with `defer` on the site, so start once the document is parsed
document.readyState === "loading" ? document.addEventListener("DOMContentLoaded", boot) : boot();
</script>
